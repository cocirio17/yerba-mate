<div class="product-grid">
  <article class="product-card" *ngFor="let producto of productos">
    <div class="product-card__visual">
      <span *ngIf="producto.oferta" class="product-card__badge">-{{ producto.descuento_porcentaje || 10 }}% OFF</span>
      <span *ngIf="producto.stock === 0" class="product-card__badge product-card__badge--dark">Sin stock</span>
      <button *ngIf="auth.currentUser" type="button" class="product-card__favorite" [class.is-favorite]="esFavorito(producto)" (click)="alternarFavorito(producto)" [attr.aria-label]="esFavorito(producto) ? 'Quitar de favoritos' : 'Agregar a favoritos'"><i class="bi" [class.bi-heart-fill]="esFavorito(producto)" [class.bi-heart]="!esFavorito(producto)"></i></button>
      <img *ngIf="producto.imagen; else noImage" [src]="producto.imagen" [alt]="producto.nombre" loading="lazy">
      <ng-template #noImage><div class="product-card__placeholder"><i class="bi bi-leaf"></i></div></ng-template>
      <button *ngIf="producto.stock > 0" type="button" class="product-card__quick" (click)="agregarRapido(producto)"><i class="bi bi-plus"></i> Agregar rápido</button>
    </div>
    <div class="product-card__body">
      <span class="product-card__type">{{ producto.tipo || 'Selección de la casa' }}</span>
      <a class="product-card__name" [routerLink]="['/producto', producto.id]">{{ producto.nombre }}</a>
      <div class="product-card__footer"><span class="product-card__prices"><del *ngIf="producto.oferta">{{ producto.precio | currency }}</del><span class="product-card__price">{{ (producto.oferta ? producto.precio * (1 - (producto.descuento_porcentaje || 10) / 100) : producto.precio) | currency }}</span></span><a [routerLink]="['/producto', producto.id]" class="product-card__arrow" aria-label="Ver producto"><i class="bi bi-arrow-up-right"></i></a></div>
    </div>
  </article>
</div>
