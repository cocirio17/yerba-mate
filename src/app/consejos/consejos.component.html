<main class="tips-page"><header class="tips-heading"><span class="eyebrow">El saber matero</span><h1>Pequeños secretos,<br><em>grandes mates.</em></h1><p>Guías simples para preparar, compartir y disfrutar mejor cada ronda.</p></header><section class="tips-masonry container"><article appScrollReveal *ngFor="let consejo of consejos; let i = index" [class.is-featured]="i === 0"><img [src]="consejo.imagen" [alt]="consejo.titulo"><div><span>{{ consejo.categoria }}</span><h2>{{ consejo.titulo }}</h2><p>{{ consejo.descripcion }}</p><a routerLink="/contacto">Leer consejo <i class="bi bi-arrow-up-right"></i></a></div></article></section></main>
