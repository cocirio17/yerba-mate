<main class="account-shell"><section class="account-card"><span class="eyebrow">Tu cuenta YerbaShop</span><h1>Una ronda más personal.</h1><p>Guardá tus favoritos, seguí tus pedidos y hacé de cada compra un ritual simple.</p><div class="account-error" *ngIf="error">{{ error }}</div><form [formGroup]="form" (ngSubmit)="submit()"><label class="account-field"><span>Nombre</span><input formControlName="nombre" placeholder="Tu nombre"></label><label class="account-field"><span>Email</span><input type="email" formControlName="email" placeholder="nombre@email.com"></label><label class="account-field"><span>Contraseña</span><input type="password" formControlName="password" placeholder="Mínimo 6 caracteres"></label><button class="account-submit" type="submit">Crear cuenta <i class="bi bi-arrow-right"></i></button></form><p class="account-foot">¿Ya tenés una cuenta? <a routerLink="/login">Iniciar sesión</a></p></section></main>
