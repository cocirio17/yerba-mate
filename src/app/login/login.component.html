<main class="account-shell"><section class="account-card"><span class="eyebrow">Bienvenido de vuelta</span><h1>Volvamos a la ronda.</h1><p>Ingresá a tu cuenta para ver tus pedidos, favoritos y datos guardados.</p><div class="account-error" *ngIf="error">{{ error }}</div><form [formGroup]="form" (ngSubmit)="submit()"><label class="account-field"><span>Email</span><input type="email" formControlName="email" placeholder="nombre@email.com"></label><label class="account-field"><span>Contraseña</span><input type="password" formControlName="password" placeholder="Tu contraseña"></label><a class="forgot-link" routerLink="/recuperar-password">¿Olvidaste tu contraseña?</a><button class="account-submit" type="submit">Iniciar sesión <i class="bi bi-arrow-right"></i></button></form><p class="account-foot">¿Todavía no tenés cuenta? <a routerLink="/registro">Crear una cuenta</a></p></section></main>
