<main class="account-shell"><section class="account-card"><span class="eyebrow">Recuperar acceso</span><h1>Volvamos a la ronda.</h1><p *ngIf="!sent">Ingresá tu email y te enviaremos instrucciones para crear una nueva contraseña.</p><div class="account-success" *ngIf="sent">Si el email existe, revisá las instrucciones para recuperar tu contraseña.</div><div class="account-error" *ngIf="error">{{ error }}</div><form *ngIf="!sent" [formGroup]="form" (ngSubmit)="submit()"><label class="account-field"><span>Email</span><input type="email" formControlName="email" placeholder="nombre@email.com"></label><button class="account-submit" type="submit">Enviar instrucciones <i class="bi bi-arrow-right"></i></button></form><p class="account-foot"><a routerLink="/login">Volver a iniciar sesión</a></p></section></main>
